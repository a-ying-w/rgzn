# E1d：与 E1b 相同的预训练微调，仅开启类别加权，验证 2.2x 不均衡下加权是否有效
exp_id: e1d
seed: 42

data:
  root: data/raw/plantvillage
  split_dir: data/splits
  classes:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Leaf_Mold
    - Tomato___Septoria_leaf_spot
    - Tomato___healthy
  image_size: 224
  resize_size: 256
  num_workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: resnet18
  pretrained: true

train:
  epochs: 15
  batch_size: 64
  lr_backbone: 0.0001
  lr_head: 0.001
  freeze_backbone: false
  weight_decay: 0.0001
  label_smoothing: 0.1
  amp: true
  subset_ratio: 1.0
  aug: basic
  class_weight: balanced   # 与 E1b 的唯一差异
  scheduler: cosine
  patience: 0
  monitor: macro_f1

output_dir: runs
