# E1e（C 岗）：MobileNetV3-Small 预训练全量微调，与 E1b（resnet18 ft）同配置对比。
# 用法：
#   python -m src.train --config configs/e1_mobilenet_v3_small.yaml --seed 42
#   python -m src.train --config configs/e1_mobilenet_v3_small.yaml --seed 42 --set model.pretrained=false
exp_id: e1e
seed: 42

data:
  root: data/raw/plantvillage
  split_dir: data/splits
  classes:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Leaf_Mold
    - Tomato___Septoria_leaf_spot
    - Tomato___healthy
  image_size: 224
  resize_size: 256
  num_workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: mobilenet_v3_small
  pretrained: true

train:
  epochs: 15
  batch_size: 64
  lr_backbone: 0.0001     # 与 E1b 完全一致，保证"只换模型"的对比成立
  lr_head: 0.001
  freeze_backbone: false
  weight_decay: 0.0001
  label_smoothing: 0.1
  amp: true
  subset_ratio: 1.0
  aug: basic
  class_weight: none
  scheduler: cosine
  patience: 0
  monitor: macro_f1

output_dir: runs
