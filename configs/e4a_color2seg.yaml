# E4a：跨域零样本评测 —— color 训练好的权重，直接在 segmented（去背景）上测。
# 不需要训练，只跑评测；与 E1b（color→color）对比，掉多少点 = 模型对背景的依赖程度。
# 用法（在 B 的 E1b 跑完之后）:
#   python -m src.eval --config configs/e4a_color2seg.yaml \
#       --ckpt runs/e1b_resnet18_ft_r100_s42/best.pth --exp-id e4a \
#       --run-name e4a_color2seg_resnet18_ft_s42
exp_id: e4a
seed: 42

data:
  root: data/raw/plantvillage
  variant: segmented       # 关键：测试集整体换成去背景版本
  split_dir: data/splits
  classes:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Leaf_Mold
    - Tomato___Septoria_leaf_spot
    - Tomato___healthy
  image_size: 224
  resize_size: 256
  num_workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: resnet18
  pretrained: true

train:
  epochs: 15
  batch_size: 64
  lr_backbone: 0.0001
  lr_head: 0.001
  freeze_backbone: false
  weight_decay: 0.0001
  label_smoothing: 0.1
  amp: true
  subset_ratio: 1.0
  aug: basic
  class_weight: none
  scheduler: cosine
  patience: 0
  monitor: macro_f1

output_dir: runs
