# 全组共用的基线配置。任何实验都从这里继承，只覆盖需要改的字段。
seed: 42

data:
  # 指向 PlantVillage 根目录（含 color/ 的那一层）
  root: data/raw/plantvillage
  variant: color           # color | segmented（E4 跨域：训练用 color、测试换 segmented）
  split_dir: data/splits
  classes:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Leaf_Mold
    - Tomato___Septoria_leaf_spot
    - Tomato___healthy
  image_size: 224
  resize_size: 256
  num_workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: resnet18          # cnn | resnet18 | mobilenet_v3_small
  pretrained: true

train:
  epochs: 15
  batch_size: 64
  # 分组学习率：backbone / head 各一份。从零训练时把两者设成同值即可
  lr_backbone: 0.0001
  lr_head: 0.001
  freeze_backbone: false  # true=冻结主干只训 head（E0 用）；pretrained=false 时忽略
  weight_decay: 0.0001    # BN 与 bias 不参与衰减
  label_smoothing: 0.1
  amp: true
  subset_ratio: 1.0       # E1b：训练集只用 0.1 / 0.25 / 0.5 / 1.0
  aug: basic              # none | basic | strong
  class_weight: none      # none | balanced（只用 train split 计数，禁止用 val/test）
  scheduler: cosine
  patience: 0             # <=0 关闭早停
  monitor: macro_f1       # best.pth 的挑选准则，不按 acc

output_dir: runs
