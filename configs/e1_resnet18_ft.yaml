# E1b：resnet18 预训练权重全量微调（与 E1a 从零训练、E0 冻结基线对比）
exp_id: e1
seed: 42

data:
  root: data/raw/plantvillage
  split_dir: data/splits
  classes:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Leaf_Mold
    - Tomato___Septoria_leaf_spot
    - Tomato___healthy
  image_size: 224
  resize_size: 256
  num_workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: resnet18
  pretrained: true

train:
  epochs: 15
  batch_size: 64
  lr_backbone: 0.0001     # 预训练主干小 lr 微调
  lr_head: 0.001          # head 随机初始化，用大 lr
  freeze_backbone: false
  weight_decay: 0.0001
  label_smoothing: 0.1
  amp: true
  subset_ratio: 1.0
  aug: basic
  class_weight: none
  scheduler: cosine
  patience: 0
  monitor: macro_f1

output_dir: runs
