# E4b：segmented 域内训练（上界对照）—— 训练和测试都在去背景图上。
# 用来排除"模型本身就不认去背景图"这一解释，E4a 的掉点才算在"背景依赖"账上。
# 用法: python -m src.train --config configs/e4b_seg2seg.yaml --seed 42
exp_id: e4b
seed: 42

data:
  root: data/raw/plantvillage
  variant: segmented       # 训练 + 验证 + 测试全部换成去背景版本
  split_dir: data/splits   # 划分文件不变：同一组图片必须落在同一 split
  classes:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Leaf_Mold
    - Tomato___Septoria_leaf_spot
    - Tomato___healthy
  image_size: 224
  resize_size: 256
  num_workers: 4
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  name: resnet18
  pretrained: true

train:
  epochs: 15
  batch_size: 64
  lr_backbone: 0.0001
  lr_head: 0.001
  freeze_backbone: false
  weight_decay: 0.0001
  label_smoothing: 0.1
  amp: true
  subset_ratio: 1.0
  aug: basic
  class_weight: none
  scheduler: cosine
  patience: 0
  monitor: macro_f1

output_dir: runs
